# ===================================
#  Form Field Definitions
# ===================================

fields:
    wrapper:
        type: nestedform
        showPanel: false
        form:
            tabs:
                fields:
                    navigation_width:
                        label: Šířka navigace
                        type: dropdown
                        tab: Navbar
                        options:
                            full: Celá šířka
                            container: V kontejneru
                        default: container

                    navigation_align:
                        label: Zarovnání navigace
                        type: dropdown
                        tab: Navbar
                        options:
                            left: Vlevo
                            center: Na střed
                            right: Vpravo
                        default: right

                    navigation_mobile_extra_links:
                        label: Zobrazení extra odkazů v mobilní navigaci
                        type: dropdown
                        tab: Navbar
                        options:
                            navbar: V navigačním menu
                            open: V otevřeném stavu pod menu tlačítkem
                        default: open

                    styles_globalScss:
                        label: Globální SCSS
                        type: codeeditor
                        language: scss
                        size: giant
                        tab: Globální CSS
                        comment: SCSS společné pro všechny weby. Kompiluje se před SCSS jednotlivých webů, takže tam lze použít zde definované proměnné a mixiny.

                    integration_captcha_section:
                        label: Captcha
                        type: section
                        tab: Captcha

                    integration_captcha_variant:
                        label: Captcha varianta
                        type: dropdown
                        options:
                            altcha: Altcha
                            turnstile: Turnstile
                        default: altcha
                        tab: Captcha

                    integration_altcha_key:
                        label: Captcha key
                        tab: Captcha
                        type: sensitive
                        commentHtml: true
                        comment: Pro Turnstile najdete site key a secret v <a href="https://dash.cloudflare.com/?to=/:account/turnstile" target="_blank" rel="noopener noreferrer">Cloudflare dashboardu → Turnstile</a>.

                    integration_altcha_secret:
                        label: Captcha secret
                        tab: Captcha
                        type: sensitive

                    integration_send_client_email:
                        label: Posílat e-mail zákazníkovi
                        type: switch
                        default: false
                        tab: Formuláře a emaily
                        comment: Po odeslání formuláře se kromě backoffice pošle potvrzovací e-mail i zákazníkovi.

                    integration_n8n_section:
                        label: N8N
                        type: section
                        tab: Formuláře a emaily

                    integration_n8n_webhook_url:
                        label: N8N webhook URL
                        tab: Formuláře a emaily
                        type: text
                        comment: Webhook URL pro N8N
                        placeholder: https://n8n.example.com/webhook/your-webhook-id

                    integration_n8n_newsletter_webhook_url:
                        label: N8N newsletter webhook URL
                        tab: Formuláře a emaily
                        type: text
                        comment: Webhook URL pro newsletter
                        placeholder: https://n8n.example.com/webhook/your-webhook-id

                    integration_n8n_auth:
                        label: N8N heslo pro webhook
                        type: sensitive
                        comment: Heslo pro webhook
                        tab: Formuláře a emaily

                    integration_google_places_api_key:
                        label: Google Places API klíč
                        type: sensitive
                        tab: Google recenze
                        commentHtml: true
                        comment: Klíč s povoleným <a href="https://console.cloud.google.com/apis/library/places.googleapis.com" target="_blank" rel="noopener noreferrer">Places API (New)</a>. Místa a stažené recenze spravujete v Builder → Google recenze.
