uuid: f5321174-a020-4b8a-a848-7da2e7c6fc2d
handle: Blocks/Header
type: mixin
name: Hlavička stránky

fields:
    content:
        type: nestedform
        showPanel: false
        tab: Blok
        form:
            tabs:
                fields:
                    image:
                        label: Obrázek
                        type: mediafinder
                        mode: image
                        maxItems: 1
                        tab: Obsah
                        span: left

                    imageMobile:
                        label: Obrázek na mobilu
                        type: mediafinder
                        mode: image
                        maxItems: 1
                        tab: Obsah
                        span: right

                    isVideoBg:
                        label: Video na pozadí
                        type: switch
                        default: false
                        tab: Obsah
                        comment: Použijte pole "Obrázek" jako video a "Obrázek na mobilu" jako poster

                    fullVideo:
                        label: Celé video (popup)
                        type: mediafinder
                        mode: file
                        maxItems: 1
                        tab: Obsah
                        span: left
                        comment: Po kliknutí na tlačítko přehrávání se video otevře v okně přes stránku
                        trigger:
                            action: show
                            field: isVideoBg
                            condition: checked

                    fullVideoLabel:
                        label: Text tlačítka videa
                        tab: Obsah
                        span: right
                        trigger:
                            action: show
                            field: isVideoBg
                            condition: checked

                    buttons:
                        tab: Obsah
                        type: mixin
                        source: Mixins/Buttons

                    fullHeight:
                        label: Přes celou výšku
                        type: switch
                        default: true
                        tab: Nastavení

                    contrast:
                        label: Kontrastní text
                        type: switch
                        default: false
                        tab: Nastavení

                    overlay:
                        label: Zatmavení pozadí
                        type: switch
                        default: false
                        tab: Nastavení